name: Publish theme release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      title:
        description: Release title
        required: true

permissions:
  contents: read

concurrency:
  group: publish-theme-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run quality
      - run: git diff --exit-code -- build

      - name: Validate release inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          [[ -z "$existing_tag" ]] || { echo 'Choose a new tag; existing tags are immutable.' >&2; exit 1; }

          main_theme="themes/sibnight.theme.css"
          [[ -f "$main_theme" && ! -L "$main_theme" ]]

          mapfile -d '' flavors < <(
            find themes/flavors -maxdepth 1 -type f -name '*.theme.css' -print0 | sort -z
          )

          if [[ "${#flavors[@]}" -ne 8 ]]; then
            echo "Expected exactly 8 flavor CSS files, found ${#flavors[@]}." >&2
            exit 1
          fi

          for file in "${flavors[@]}"; do
            [[ -f "$file" && ! -L "$file" ]]
          done

      - name: Build CSS-only package
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf release
          mkdir -p release/SibNight/flavors

          install -m 0644 themes/sibnight.theme.css release/SibNight/sibnight.theme.css
          find themes/flavors -maxdepth 1 -type f -name '*.theme.css' -print0 \
            | sort -z \
            | xargs -0 -I{} install -m 0644 "{}" release/SibNight/flavors/

          if find release/SibNight -type f ! -name '*.theme.css' -print -quit | grep -q .; then
            echo "Package contains a non-CSS file." >&2
            exit 1
          fi

          css_count="$(find release/SibNight -type f -name '*.theme.css' | wc -l | tr -d ' ')"
          if [[ "$css_count" != "9" ]]; then
            echo "Expected 9 CSS files in package, found $css_count." >&2
            exit 1
          fi

          safe_tag="${RELEASE_TAG//\//-}"
          zip_name="SibNight-${safe_tag}-themes.zip"
          (cd release && zip -q -9 -r "../${zip_name}" SibNight)

          while IFS= read -r entry; do
            case "$entry" in
              */|*.theme.css) ;;
              *)
                echo "Unexpected ZIP entry: $entry" >&2
                exit 1
                ;;
            esac
          done < <(zipinfo -1 "$zip_name")

          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## SibNight theme pack

          Cette release contient uniquement les fichiers BetterDiscord prêts à l'emploi :

          - `sibnight.theme.css` : thème principal ;
          - les huit variantes présentes dans le dossier `flavors` ;
          - une archive ZIP contenant exactement ces neuf fichiers CSS.

          Aucun fichier source JavaScript, outil de sécurité ou fichier de configuration n'est inclus dans l'archive personnalisée.

          GitHub ajoute automatiquement ses archives « Source code » à toute release ; elles sont distinctes du pack CSS fourni ici.
          EOF

      - name: Publish release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          assets=(
            "$ZIP_NAME"
            release/SibNight/sibnight.theme.css
            release/SibNight/flavors/*.theme.css
          )

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
