name: Manual secret and identity guard
on:
  workflow_dispatch:
    inputs:
      profile: {description: Scan depth, required: true, default: full, type: choice, options: [quick, full]}
      enforcement: {description: Result handling, required: true, default: report, type: choice, options: [report, block]}
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0, persist-credentials: false}
      - run: mkdir -p .security-reports
      - id: identity
        continue-on-error: true
        env: {PROFILE: "${{ inputs.profile }}"}
        shell: bash
        run: "args=(--report .security-reports/identity.json);[[ \"$PROFILE\" == full ]]&&args+=(--history);python3 .github/scripts/security_guard.py \"${args[@]}\""
      - run: "a=$RUNNER_TEMP/gitleaks.tgz;curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o $a;echo \"551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $a\"|sha256sum -c --strict;tar -xzf $a -C $RUNNER_TEMP gitleaks"
      - id: gitleaks
        continue-on-error: true
        env: {PROFILE: "${{ inputs.profile }}"}
        shell: bash
        run: "if [[ \"$PROFILE\" == full ]];then $RUNNER_TEMP/gitleaks git . --log-opts=--all --redact=100 --exit-code=2 --report-format=json --report-path=.security-reports/gitleaks.json;else $RUNNER_TEMP/gitleaks dir . --redact=100 --exit-code=2 --report-format=json --report-path=.security-reports/gitleaks.json;fi"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "secret-identity-reports-${{ github.run_id }}", path: .security-reports/, retention-days: 30, include-hidden-files: true}
      - if: always()
        env: {A: "${{ steps.identity.outcome }}", B: "${{ steps.gitleaks.outcome }}", E: "${{ inputs.enforcement }}"}
        shell: bash
        run: "f=0;[[ \"$A\" == success ]]||f=1;[[ \"$B\" == success ]]||f=1;[[ \"$E\" == block ]]&&exit \"$f\";exit 0"
