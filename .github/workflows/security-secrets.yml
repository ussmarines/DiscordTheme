name: Security and secret guard

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and private identity
        run: python3 .github/scripts/security_guard.py
      - name: Scan changed commits with Gitleaks
        id: incremental
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Scan complete history with redaction
        id: full_history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/security/secret-hardening-2026-08-04'
        continue-on-error: true
        run: gitleaks git --redact=100 --verbose --exit-code=2 --log-opts="--all" .
      - name: Enforce scan results
        if: always()
        shell: bash
        run: |
          failed=0
          [[ "${{ steps.incremental.outcome }}" == "success" ]] || failed=1
          [[ "${{ steps.full_history.outcome }}" == "skipped" || "${{ steps.full_history.outcome }}" == "success" ]] || failed=1
          exit "$failed"
