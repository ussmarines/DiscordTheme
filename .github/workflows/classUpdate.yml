name: Update Classes

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update_class]

permissions:
  contents: read

concurrency:
  group: class-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.create-patch.outputs.changed }}

    steps:
      # Immutable SHA: actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze mapping for both updater passes
        shell: bash
        run: |
          set -euo pipefail

          mapping_dir="$RUNNER_TEMP/class-update-input"
          mkdir -p "$mapping_dir"
          curl --fail --silent --show-error --location --max-time 30 \
            https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt \
            --output "$mapping_dir/Changes.txt"
          sha256sum "$mapping_dir/Changes.txt" >> "$GITHUB_STEP_SUMMARY"

          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$mapping_dir" \
            >"$RUNNER_TEMP/class-update-http.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/class-update-http.pid"

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/Changes.txt >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/class-update-http.log" >&2
          exit 1

      - id: update-src
        # The third-party updater runs only in this read-only job.
        uses: metro420yt/class-update@24007abb2ae3488d7742270787f4807255ab0d97 # v1
        with:
          folder: src
          ext: css
          diff: http://127.0.0.1:8765/Changes.txt

      - id: update-flavors
        uses: metro420yt/class-update@24007abb2ae3488d7742270787f4807255ab0d97 # v1
        with:
          folder: themes/flavors
          ext: css
          diff: http://127.0.0.1:8765/Changes.txt

      - name: Stop frozen mapping server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/class-update-http.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/class-update-http.pid")" 2>/dev/null || true
          fi

      - name: Reject unexpected updater changes before executing repository code
        shell: bash
        run: |
          set -euo pipefail

          is_allowed_path() {
            case "$1" in
              src/*.css|themes/flavors/*.css)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          if IFS= read -r -d '' _ < <(
            {
              git ls-files --others --exclude-standard -z
              git ls-files --others --ignored --exclude-standard -z
            }
          ); then
            echo "::error::The updater created an unexpected untracked file."
            exit 1
          fi

          while IFS= read -r -d '' path; do
            if ! is_allowed_path "$path"; then
              echo "::error::The updater modified a path outside the approved source CSS allowlist."
              exit 1
            fi
          done < <(git diff --name-only -z HEAD --)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Reject changes beyond class hashes
        run: node scripts/check-class-update.js

      - name: Build and check release outputs
        run: npm run quality

      - name: Validate changes and create patch
        id: create-patch
        shell: bash
        run: |
          set -euo pipefail

          is_allowed_path() {
            case "$1" in
              src/*.css|themes/flavors/*.css|build/sibnight.css|build/sibnight-flavor.css)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            if ! is_allowed_path "$path"; then
              echo "::error::The updater modified a path outside the approved CSS allowlist."
              exit 1
            fi
          done < <(git diff --name-only -z HEAD --)

          if IFS= read -r -d '' _ < <(git ls-files --others --exclude-standard -z); then
            echo "::error::The build created an unexpected untracked file."
            exit 1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" != "true" ]]; then
            exit 0
          fi

          patch_path="$RUNNER_TEMP/class-update.patch"
          git diff --binary --full-index HEAD -- \
            src \
            themes/flavors \
            build/sibnight.css \
            build/sibnight-flavor.css > "$patch_path"
          test -s "$patch_path"

      - name: Upload validated patch
        if: steps.create-patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: class-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/class-update.patch
          if-no-files-found: error
          retention-days: 14

      - name: Require visual review before publication
        if: steps.create-patch.outputs.changed == 'true'
        run: echo 'Download the patch, apply it to the recorded run SHA, run the quality gate and the Discord checklist before committing and pushing main.' >> "$GITHUB_STEP_SUMMARY"
